# Development overrides. Docker Compose picks this file up automatically.
# It mounts your source code into the container, so a code change needs only
# `docker compose restart bot` — no rebuild.
#
# IMPORTANT: this file must NOT exist on the production server. It mounts source
# code and publishes ports directly. Production is started explicitly with:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
services:
  bot:
    volumes:
      - .:/app
    environment:
      LOG_LEVEL: DEBUG

  dj:
    volumes:
      - .:/app
    environment:
      LOG_LEVEL: DEBUG
    ports:
      - "127.0.0.1:8000:8000"
