<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>LYFE</title>
<link rel="preload" href="/static/app/logo-ink.png?v=__ASSET_V__" as="image">
<link rel="stylesheet" href="/static/app/fonts/fonts.css?v=__ASSET_V__">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Paper and ink. No cards, no frames: hierarchy comes from type size,
     weight and white space, the way a poster does it. */
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #5c5c5c;
    --ink-3: #9a9a9a;
    --rule: #e6e6e6;
    --font-display: 'Unbounded', 'Druk Wide', 'Arial Black', sans-serif;
    --font-text: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --gutter: 20px;
    --tabbar: 58px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 400 16px/1.45 var(--font-text);
    min-height: var(--tg-viewport-stable-height, 100vh);
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; }
  button:disabled { cursor: default; }
  input { font: inherit; color: inherit; }
  ::selection { background: var(--ink); color: var(--paper); }

  .view {
    padding: 18px var(--gutter) calc(var(--tabbar) + var(--safe-b) + 40px);
    max-width: 560px; margin: 0 auto;
    animation: enter .35s ease both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- type ---------- */
  .d { font-family: var(--font-display); text-transform: uppercase; letter-spacing: -.01em; }
  .label {
    font-family: var(--font-display); font-size: 10px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3);
  }
  .mega {
    font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(40px, 13.5vw, 72px); line-height: .9; letter-spacing: -.03em;
    margin: 0; overflow-wrap: normal; word-break: normal; hyphens: manual;
  }
  .big-num {
    font-family: var(--font-display); font-weight: 900; line-height: .85;
    font-size: clamp(64px, 24vw, 120px); letter-spacing: -.05em;
  }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  p { margin: 0; }

  .rule { height: 1px; background: var(--ink); margin: 28px 0 14px; }
  .rule.soft { background: var(--rule); }
  .gap { height: 44px; }

  .topline {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 26px;
  }
  /* the logo file has a lot of white around the mark; crop to the letters */
  /* ink on transparency: sits on any paper colour without a white box */
  .mark { width: 88px; height: 44px; background: url(/static/app/logo-ink.png?v=__ASSET_V__) 0 50% / contain no-repeat; }

  .meta {
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; margin-top: 18px; line-height: 1.7;
  }
  /* an item moves to the next line whole; only an item wider than the
     screen (a very long event name) wraps inside itself */
  .meta span { display: inline-block; max-width: 100%; }
  .meta span:not(:last-child)::after { content: "/"; margin: 0 .6em; color: var(--ink-3); }

  /* ---------- actions ---------- */
  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 58px; padding: 0 20px;
    background: var(--ink); color: var(--paper);
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    transition: transform .1s, opacity .15s;
  }
  .btn::after { content: "→"; font-family: var(--font-text); font-size: 20px; letter-spacing: 0; }
  .btn.plain::after { content: none; }
  .btn.plain { justify-content: center; }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .25; }
  .link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    border-bottom: 2px solid var(--ink); padding: 4px 0;
  }
  .link:disabled { opacity: .3; }

  /* ---------- home ---------- */
  .count { display: flex; align-items: flex-end; gap: 14px; margin-top: 30px; }
  .count .unit { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding-bottom: 8px; line-height: 1.3; }
  .live { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; font-family: var(--font-display); font-weight: 900; font-size: 28px; }
  .live::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tracks-mine { list-style: none; margin: 0; padding: 0; }
  .tracks-mine li { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .tracks-mine .p { font-family: var(--font-display); font-weight: 800; font-size: 22px; min-width: 44px; letter-spacing: -.02em; }
  .tracks-mine .n { font-weight: 600; line-height: 1.3; }
  .slots { display: flex; gap: 4px; margin: 16px 0 22px; }
  .slot { flex: 1; height: 3px; background: var(--rule); }
  .slot.on { background: var(--ink); }

  .wallet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; width: 100%; }
  .wallet .big-num { white-space: nowrap; }
  .wallet .big-num { font-size: clamp(56px, 20vw, 96px); }

  /* ---------- request ---------- */
  .search { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 6px 0 14px; margin-top: 18px; }
  .field { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink); }
  .field input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    font-size: 20px; font-weight: 600; padding: 12px 0; letter-spacing: -.01em;
  }
  .field input::placeholder { color: var(--ink-3); font-weight: 500; }
  .field .clear { font-size: 22px; padding: 6px 0 6px 10px; color: var(--ink-2); }
  .hint { color: var(--ink-2); font-size: 14px; margin-top: 4px; }

  .from-link { padding: 14px 0 18px; }
  .from-link .t { font-weight: 700; font-size: 20px; line-height: 1.25; margin-top: 6px; letter-spacing: -.01em; }

  .res { list-style: none; margin: 0; padding: 0; }
  .res li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .from-link + .res li:first-child { border-top: 1px solid var(--ink); }
  .cover { width: 52px; height: 52px; flex: none; background: #f2f2f2 center/cover no-repeat; filter: grayscale(1) contrast(1.05); }
  .res li:hover .cover, .res .cover.color { filter: none; }
  .tinfo { flex: 1; min-width: 0; }
  .ttitle { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .tartist { color: var(--ink-2); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnote { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .add {
    flex: none; height: 40px; min-width: 40px; padding: 0 12px;
    background: var(--ink); color: var(--paper);
    font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  .add { display: grid; place-items: center; text-align: center; }
  .add.plus { font-family: var(--font-text); font-size: 24px; font-weight: 300; padding: 0; width: 40px; line-height: 1; }
  .add:disabled { background: none; color: var(--ink); border: 0; font-size: 18px; }

  .say { padding: 24px 0 8px; }
  .say .h { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.15; text-transform: uppercase; letter-spacing: -.01em; }
  .say .s { color: var(--ink-2); margin-top: 10px; font-size: 15px; }

  .manual { margin-top: 18px; }
  .manual .field input { font-size: 18px; }
  .err { font-size: 13px; margin-top: 8px; font-weight: 600; }

  .done { padding-top: 10px; }
  .done .title { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(30px, 10vw, 52px); line-height: .95; letter-spacing: -.03em; margin-top: 18px; overflow-wrap: normal; hyphens: manual; }
  .done .artist { font-size: 18px; font-weight: 600; margin-top: 10px; }

  /* ---------- top ---------- */
  .board { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .board li { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .board .pos { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -.04em; line-height: 1; }
  .board li:nth-child(n+4) .pos { font-size: 17px; color: var(--ink-2); }
  .board .ttitle { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .board .right { display: flex; align-items: center; gap: 4px; }
  .board .score { font-family: var(--font-display); font-weight: 800; font-size: 16px; min-width: 34px; text-align: right; margin-right: 6px; }
  .board .act { width: 38px; height: 38px; display: grid; place-items: center; font-size: 20px; }
  .board .act.boost { font-family: var(--font-display); font-size: 10px; font-weight: 800; letter-spacing: .02em; border: 1.5px solid var(--ink); width: 38px; height: 30px; }
  .board .act:disabled { opacity: .2; }
  .board .tag { font-family: var(--font-display); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-right: 8px; }
  .board li.pri { background: var(--ink); color: var(--paper); margin: 0 calc(var(--gutter) * -1); padding-left: var(--gutter); padding-right: var(--gutter); border-bottom-color: var(--ink); }
  .board li.pri .tartist { color: #bdbdbd; }
  .board li.pri .act.boost { border-color: var(--paper); }
  .board li.played .ttitle { text-decoration: line-through; text-decoration-thickness: 2px; }
  .board li.played { color: var(--ink-3); }
  .board li.played .tartist { color: var(--ink-3); }
  @media (max-width: 360px) {
    .board li { grid-template-columns: 34px 1fr auto; gap: 8px; }
    .board .pos { font-size: 20px; }
    .board li:nth-child(n+4) .pos { font-size: 15px; }
    .board .score { font-size: 14px; min-width: 24px; margin-right: 2px; }
    .board .act { width: 32px; height: 34px; font-size: 18px; }
    .board .act.boost { width: 34px; height: 28px; }
    .board .right { gap: 2px; }
  }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--ink-2); margin: 14px 0 16px; }

  /* ---------- my lyfe ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 12px; margin-top: 26px; border-top: 1px solid var(--ink); }
  .stats .label { letter-spacing: .08em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats div { padding: 14px 0 0; }
  .stats b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 34px; letter-spacing: -.04em; line-height: 1; }
  .stats span { display: block; margin-top: 8px; }
  .offer { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 18px 0 20px; border-bottom: 1px solid var(--rule); }
  .offer .nm { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: -.01em; }
  .offer .price { font-family: var(--font-display); font-weight: 900; font-size: 20px; text-align: right; }
  .offer .price small { display: block; font-size: 9px; font-weight: 600; letter-spacing: .14em; color: var(--ink-3); }
  .offer .ds { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; max-width: 34ch; }
  .offer .state { grid-column: 1 / -1; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; }
  .pass { margin-top: 30px; }
  .pass .qr { width: min(72vw, 280px); margin: 0 auto; }
  .earnline { margin-top: 18px; font-size: 14px; color: var(--ink-2); line-height: 1.7; }
  .ledger { list-style: none; margin: 0; padding: 0; }
  .ledger li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .ledger .v { font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .earn li .v::before { content: "+"; }

  /* ---------- tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(255,255,255,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--ink);
    padding-bottom: var(--safe-b);
  }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; height: var(--tabbar); }
  .tab {
    position: relative; display: grid; place-items: center; text-align: center;
    font-family: var(--font-display); font-size: 10px; font-weight: 600;
    letter-spacing: .14em; color: var(--ink-3);
  }
  .tab.on { color: var(--ink); font-weight: 800; }
  .tab.on::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 4px; background: var(--ink); }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(255,255,255,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--paper); border-top: 2px solid var(--ink);
    padding: 20px var(--gutter) calc(24px + var(--safe-b));
    max-height: 90vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    max-width: 560px; margin: 0 auto;
  }
  .sheet.show { transform: none; }
  .sheet .close { position: absolute; right: var(--gutter); top: 14px; font-size: 26px; line-height: 1; }
  .qr { width: min(76vw, 300px); margin: 22px auto 0; }
  .qr svg { width: 100%; height: auto; display: block; }

  .toast {
    position: fixed; left: var(--gutter); right: var(--gutter); z-index: 60;
    bottom: calc(var(--tabbar) + var(--safe-b) + 12px);
    transform: translateY(10px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--paper); padding: 16px 18px;
    font-size: 14px; font-weight: 600; transition: opacity .2s, transform .2s;
    max-width: 520px; margin: 0 auto;
  }
  .toast.show { opacity: 1; transform: none; }

  .loading { height: 72px; border-bottom: 1px solid var(--rule); position: relative; overflow: hidden; }
  .loading::after { content: ""; position: absolute; left: 0; top: 50%; height: 2px; width: 30%; background: var(--ink); animation: scan 1s ease-in-out infinite; }
  @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(400%); } }

  /* ---------- season ----------
     Everything seasonal hangs off one attribute on <html>, so switching
     SEASON off in the config brings back the plain black and white. */
  :root { --accent: var(--ink); --on-accent: var(--paper); }
  :root[data-season="halloween"] {
    --paper: #fff1e0;          /* pumpkin cream, clearly not white */
    --rule: #f2d4b4;
    --ink-2: #6b4a32;
    --ink-3: #b0876a;
    --accent: #ff5a00;
    --accent-deep: #c24100;
    --on-accent: #1a0c02;
  }
  /* primary actions turn pumpkin */
  :root[data-season="halloween"] .btn { background: var(--accent); color: var(--on-accent); }
  :root[data-season="halloween"] .btn::after { color: var(--on-accent); }
  :root[data-season="halloween"] .add { background: var(--accent); color: var(--on-accent); }
  :root[data-season="halloween"] .add:disabled { background: none; color: var(--ink); }
  /* the big numbers and the main rules carry the colour */
  :root[data-season="halloween"] .count .big-num,
  :root[data-season="halloween"] .wallet .big-num,
  :root[data-season="halloween"] .sheet .big-num,
  :root[data-season="halloween"] .stats b,
  :root[data-season="halloween"] .tracks-mine .p,
  :root[data-season="halloween"] .board li:nth-child(-n+3) .pos,
  :root[data-season="halloween"] .label.accent,
  :root[data-season="halloween"] .live { color: var(--accent); }
  :root[data-season="halloween"] .live::before { background: var(--accent); }
  :root[data-season="halloween"] .rule:not(.soft),
  :root[data-season="halloween"] .board,
  :root[data-season="halloween"] .stats,
  :root[data-season="halloween"] .res li:first-child { border-color: var(--accent); }
  :root[data-season="halloween"] .rule:not(.soft) { background: var(--accent); height: 2px; }
  :root[data-season="halloween"] .field { border-bottom-color: var(--accent); }
  :root[data-season="halloween"] .tabbar { background: rgba(255, 241, 224, .95); border-top: 2px solid var(--accent); }
  :root[data-season="halloween"] .tab.on { color: var(--accent); }
  :root[data-season="halloween"] .tab.on::before,
  :root[data-season="halloween"] .slot.on { background: var(--accent); }
  :root[data-season="halloween"] .link { border-bottom-color: var(--accent); }
  :root[data-season="halloween"] .board li.pri { background: var(--ink); color: var(--paper); border-bottom-color: var(--ink); }
  :root[data-season="halloween"] .board li.pri .pos,
  :root[data-season="halloween"] .board li.pri .tag { color: var(--accent); }
  :root[data-season="halloween"] .toast { background: var(--ink); color: var(--accent); }
  :root[data-season="halloween"] .sheet { border-top-color: var(--accent); }
  :root[data-season="halloween"] ::selection { background: var(--accent); color: var(--on-accent); }
  .season-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px;
    background: var(--ink); color: var(--accent);
    font-family: var(--font-display); font-size: 10px; font-weight: 800; letter-spacing: .16em;
  }
  .season-pill svg { width: 18px; height: 18px; }

  /* hidden pumpkins: small, slightly crooked, easy to miss */
  .hp { display: inline-grid; place-items: center; width: 30px; height: 30px; vertical-align: middle;
        margin: 0 4px; transform: rotate(-12deg); transition: transform .2s; animation: wobble 4s ease-in-out infinite; }
  .hp svg { width: 100%; height: 100%; }
  .hp.got { animation: gotcha .6s ease-in forwards; }
  @keyframes wobble { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(8deg) translateY(-2px); } }
  @keyframes gotcha { to { transform: scale(2.4) rotate(30deg); opacity: 0; } }

  .season-card { position: relative; }
  .season-card .title { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 11vw, 56px); line-height: .9; letter-spacing: -.03em; margin-top: 10px; }
  .season-card .facts { display: flex; gap: 22px; margin: 16px 0 18px; }
  .season-card .facts b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1; }
  .season-card .facts span { display: block; margin-top: 6px; }
  .hunt { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 14px; color: var(--ink-2); }
  .hunt .dots { display: flex; gap: 4px; }
  .hunt .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent); }
  .hunt .dots i.on { background: var(--accent); }

  .ticket-have { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 0 2px; }
  .ticket-have b { font-family: var(--font-display); font-weight: 800; font-size: 18px; text-transform: uppercase; }
  .pass-extra { margin-top: 26px; }
  .pass-extra .qr { width: min(48vw, 180px); }
  .qr svg { aspect-ratio: 1; height: auto; }
  .held { list-style: none; margin: 10px 0 0; padding: 0; }
  .held li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-weight: 600; }
  .held li span:last-child { font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; }

  /* ---------- PUMPKIN RUSH ---------- */
  .game { position: fixed; inset: 0; z-index: 90; background: var(--paper); display: flex; flex-direction: column;
          padding: 14px var(--gutter) calc(14px + var(--safe-b)); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .game-top { display: flex; align-items: center; justify-content: space-between; }
  .game-top .g-score { font-family: var(--font-display); font-weight: 900; font-size: 34px; letter-spacing: -.03em; }
  .game-top .g-close { font-size: 28px; line-height: 1; padding: 4px 0 4px 12px; }
  .g-timer { height: 3px; background: var(--rule); margin: 10px 0 0; }
  .g-timer i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
  .g-field { position: relative; flex: 1; overflow: hidden; }
  .gp { position: absolute; width: 68px; height: 68px; margin: -34px 0 0 -34px; animation: rise .18s ease-out both; }
  .gp svg { width: 100%; height: 100%; pointer-events: none; }
  .gp.hit { animation: popout .28s ease-out forwards; }
  .gp.gone { animation: sink .2s ease-in forwards; }
  @keyframes rise { from { transform: scale(.2) translateY(20px); opacity: 0; } }
  @keyframes popout { to { transform: scale(1.7); opacity: 0; } }

function toast(text) {
  const el = $('#toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function confirmBox(title, message, okText) {
  return new Promise(resolve => {
    if (tg && tg.showPopup && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
      tg.showPopup({ title, message: message.slice(0, 256), buttons: [
        { id: 'ok', type: 'default', text: okText }, { id: 'no', type: 'cancel' },
      ] }, id => resolve(id === 'ok'));
    } else {
      resolve(window.confirm(title + '\n\n' + message));
    }
  });
}

async function api(path, opts = {}) {
  const init = { method: opts.method || 'GET', headers: { 'X-Telegram-Init-Data': INIT_DATA } };
  if (opts.body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
    init.method = opts.method || 'POST';
  }
  let res;
  try { res = await fetch(path, init); }
  catch (e) { toast(L('offline')); throw e; }
  if (res.status === 401) { renderOutside(); throw new Error('401'); }
  if (!res.ok) { toast(L('error')); throw new Error(String(res.status)); }
  return res.json();
}

/* ---------------- type fitting ----------------
   Display type never hyphenates or breaks inside a word. Instead each big
   line shrinks until its longest word fits the column and the block stays
   within a few lines — event names and guest names can be anything. */

const FIT = '.mega, .done .title, .big-num';
function fitOne(el) {
  el.style.fontSize = '';
  const cs = getComputedStyle(el);
  let size = parseFloat(cs.fontSize);
  const min = el.classList.contains('big-num') ? 34 : 20;
  const maxLines = el.classList.contains('big-num') ? 1 : 3;
  const lh = () => parseFloat(getComputedStyle(el).lineHeight) || size;
  let guard = 60;
  while (guard-- > 0 && size > min &&
         (el.scrollWidth > el.clientWidth + 1 || el.offsetHeight > lh() * maxLines + 2)) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}
let fitQueued = false;
function fitAll() {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => {
    fitQueued = false;
    document.querySelectorAll(FIT).forEach(el => { if (el.offsetParent) fitOne(el); });
  });
}
new MutationObserver(fitAll).observe(document.body, { childList: true, subtree: true });
window.addEventListener('resize', fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* ---------------- tabs ---------------- */

function go(tab, opts = {}) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  rerender();
  if (tab === 'home') renderHome();
  if (tab === 'add') renderAdd(opts);
  if (tab === 'top') loadTop();
  if (tab === 'me') renderMe();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} go(b.dataset.tab); }));

async function refreshMe() {
  S.me = await api('/api/app/me');
  lang = S.me.user.language === 'uk' ? 'uk' : 'ru';
  document.documentElement.lang = lang;
  if (S.me.season) document.documentElement.dataset.season = S.me.season.name;
  else delete document.documentElement.dataset.season;
  try {
    const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#ffffff';
    tg && tg.setHeaderColor(paper); tg && tg.setBackgroundColor(paper);
    tg && tg.setBottomBarColor && tg.setBottomBarColor(paper);
  } catch (e) {}
  document.querySelectorAll('[data-l]').forEach(el => { el.textContent = L(el.dataset.l); });
}

let searchTimer, searchSeq = 0;

function say(title, sub) {
  return `<div class="say"><div class="h">${esc(title)}</div>${sub ? `<p class="s">${esc(sub)}</p>` : ''}</div>`;
}

function renderAdd(opts = {}) {
  const ev = S.me.event;
  const tn = tonight();
  const head = topline(`<span class="label num">${ev ? esc(L('slots', { used: tn.requests_used, max: rules().requests_max })) : ''}</span>`);
  if (!ev) { view.innerHTML = head + `<h1 class="mega">${esc(L('no_event_t'))}</h1><p class="muted" style="margin-top:16px">${esc(L('no_event_s'))}</p>`; return; }
  if (!ev.accepts_requests) { view.innerHTML = head + `<h1 class="mega">${esc(L('closed_t'))}</h1><p class="muted" style="margin-top:16px">${esc(L('closed_s'))}</p>`; return; }
  if (tn.requests_used >= rules().requests_max) {
    view.innerHTML = head + `<h1 class="mega">${esc(L('limit_t'))}</h1><p class="muted" style="margin:16px 0 28px">${esc(L('limit_s'))}</p>
      <button class="btn" id="totop">${esc(L('to_top'))}</button>`;
    $('#totop').onclick = () => go('top');
    return;
  }
  view.innerHTML = head + `
    <h1 class="mega" style="font-size:clamp(30px,9.5vw,52px)">${esc(L('req_title'))}</h1>
    <p class="muted" style="margin-top:10px">${esc(L('req_sub', { date: ev.date }))}</p>
    <div class="search">
      <label class="field">
        <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false"
          placeholder="${esc(L('req_ph'))}" value="${esc(S.query)}">
        <button class="clear" id="clear" ${S.query ? '' : 'hidden'} aria-label="clear">×</button>
      </label>
    </div>
    <div id="results"></div>`;
  const q = $('#q');
  q.addEventListener('input', () => {
    S.query = q.value;
    $('#clear').hidden = !q.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, /https?:\/\//i.test(q.value) ? 50 : 500);
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(); q.blur(); } });
  $('#clear').onclick = () => { S.query = ''; S.search = null; q.value = ''; $('#clear').hidden = true; drawResults(); q.focus(); };
  drawResults();
  if (!S.query && !opts.noFocus) setTimeout(() => q.focus(), 150);
}

async function runSearch() {
  const query = S.query.trim();
  if (query.length < 2) { S.search = null; drawResults(); return; }
  const seq = ++searchSeq;
  S.search = { status: 'loading' };
  S.showVersions = false;
  drawResults();
  try {
    const res = await api('/api/app/search', { body: { q: query } });
    if (seq !== searchSeq) return;
    S.search = res;
  } catch (e) {
    if (seq !== searchSeq) return;
    S.search = null;
  }
  drawResults();
}

function drawResults() {
  const box = $('#results'); if (!box) return;
  const r = S.search;
  if (!r) { box.innerHTML = `<p class="hint">${esc(L('req_hint'))} ${hiddenPumpkin('add')}</p>`; return; }
  if (r.status === 'loading') { box.innerHTML = '<div class="loading"></div><div class="loading"></div><div class="loading"></div>'; return; }
  if (r.status === 'link_unreadable') { box.innerHTML = say(L('link_bad_t'), L('link_bad_s')); return; }

  const linkBox = r.link_text
    ? `<div class="from-link"><span class="label">${esc(L('link_read'))}</span><div class="t">${esc(r.link_text)}</div></div>` : '';

  if (r.status === 'not_found' || r.status === 'link_no_match') {
    box.innerHTML = linkBox + say(L(r.status === 'link_no_match' ? 'link_nomatch_t' : 'not_found_t'), L('manual_s')) +
      manualForm(r.link_text || (/https?:\/\//i.test(S.query) ? '' : S.query));
    bindManual();
    return;
  }

  const row = (c, i) => {
    const inEv = c.in_event;
    let note = '', btn = `<button class="add plus" data-i="${i}" aria-label="add">+</button>`;
    if (c.mine) {
      note = `<div class="tnote">${esc(L('yours'))} ✓</div>`;
      btn = `<button class="add" disabled>✓</button>`;
    } else if (inEv && inEv.status !== 'PLAYED') {
      note = `<div class="tnote">${esc(L('in_list', { n: inEv.score }))}</div>`;
      btn = `<button class="add" data-i="${i}">${esc(L('join'))}</button>`;
    } else if (inEv) {
      note = `<div class="tnote faint">${esc(L('played'))}</div>`;
    }
    return `<li>${cover(c.cover)}<div class="tinfo"><div class="ttitle">${esc(c.title)}</div>
      <div class="tartist">${esc(c.artist)}${c.album ? ' · ' + esc(c.album) : ''}</div>${note}</div>${btn}</li>`;
  };
  const exact = r.exact_first && !S.showVersions;
  const shown = exact ? r.candidates.slice(0, 1) : r.candidates;
  box.innerHTML = linkBox + `<ul class="res">${shown.map(row).join('')}</ul>
    <div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:22px">
      ${exact && r.candidates.length > 1 ? `<button class="link" id="versions">${esc(L('versions'))} ↓</button>` : ''}
      <button class="link" id="notit">${esc(L('not_it'))}</button>
    </div>
    <div id="manualslot"></div>`;
  box.querySelectorAll('.add[data-i]').forEach(b => b.onclick = () => submitRequest({ token: r.candidates[+b.dataset.i].token, q: S.query }, b));
  const v = $('#versions'); if (v) v.onclick = () => { S.showVersions = true; drawResults(); };
  $('#notit').onclick = () => {
    $('#notit').remove();
    $('#manualslot').innerHTML = manualForm(r.link_text || (/https?:\/\//i.test(S.query) ? '' : S.query));
    bindManual(true);
  };
}

function manualForm(prefill) {
  return `<div class="manual">
    <label class="field"><input id="manual" type="text" autocomplete="off" placeholder="${esc(L('manual_ph'))}" value="${esc(prefill || '')}"></label>
    <p class="err" id="manualerr" hidden></p>
    <button class="btn" id="manualgo" style="margin-top:18px">${esc(L('manual_btn'))}</button></div>`;
}
function bindManual(focus) {
  const input = $('#manual'); if (!input) return;
  if (focus) setTimeout(() => input.focus(), 50);
  const err = $('#manualerr');
  const submit = async () => {
    const value = input.value.trim();
    if (/https?:\/\//i.test(value)) { err.hidden = false; err.textContent = L('manual_link'); haptic('error'); return; }
    if (!/\s[-–—]\s/.test(value) && !/^[^-]+-[^-]+$/.test(value)) { err.hidden = false; err.textContent = L('manual_format'); haptic('error'); return; }
    // "Artist-Title" without spaces is fine to type; "Jay-Z - Song" must stay as is.
    const normalized = /\s[-–—]\s/.test(value) ? value : value.replace(/\s*[-–—]\s*/, ' - ');
    await submitRequest({ manual: normalized }, $('#manualgo'));
  };
  $('#manualgo').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

async function submitRequest(body, button) {
  if (S.busy) return;
  S.busy = true; if (button) button.disabled = true;
  let res;
  try { res = await api('/api/app/request', { body }); }
  catch (e) { S.busy = false; if (button) button.disabled = false; return; }
  S.busy = false;
  setPoints(res.points);

  if (res.status === 'MANUAL_FORMAT' || res.status === 'MANUAL_IS_LINK') {
    const err = $('#manualerr');
    if (err) { err.hidden = false; err.textContent = L(res.status === 'MANUAL_FORMAT' ? 'manual_format' : 'manual_link'); }
    if (button) button.disabled = false;
    haptic('error');
    return;
  }
  if (res.status === 'LIMIT_REACHED' || res.status === 'EVENT_CLOSED') { haptic('warning'); await refreshMe(); renderAdd(); return; }
  if (res.status === 'ALREADY_REQUESTED') { haptic('warning'); toast(L('already')); if (button) button.disabled = false; return; }

  haptic('ok');
  S.query = ''; S.search = null;
  await refreshMe();
  rerender();
  const track = res.track || {};
  const n = res.requests_count || 1;
  const canBoost = tonight().boosts_used < rules().boosts_max && S.me.user.points >= rules().cost_boost;
  view.innerHTML = topline() + `
    <div class="done">
      <span class="label">${esc(L('added_t'))}</span>
      <div class="title">${esc(track.title || '')}</div>
      <div class="artist">${esc(track.artist || '')}</div>
      <div class="rule"></div>
      <p>${esc(n <= 1 ? L('added_first') : L('added_nth', { n }))}</p>
      <p class="muted" style="margin-top:4px">${esc(L('added_s'))}</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:32px">
      ${canBoost && res.event_track_id ? `<button class="btn" id="boostnew">${esc(L('boost_it', { c: rules().cost_boost }))}</button>` : ''}
      <button class="btn${canBoost ? ' plain' : ''}" id="totop" ${canBoost ? 'style="background:none;color:var(--ink);border:2px solid var(--ink)"' : ''}>${esc(L('to_top'))}</button>
    </div>
    ${tonight().requests_used < rules().requests_max ? `<div style="margin-top:24px"><button class="link" id="more">${esc(L('add_more'))} +</button></div>` : ''}`;
  $('#totop').onclick = () => go('top');
  const m = $('#more'); if (m) m.onclick = () => go('add');
  const b = $('#boostnew');
  if (b) b.onclick = async () => {
    if (await doBoost({ id: res.event_track_id, title: track.title, artist: track.artist })) go('top');
  };
}

/* ---------------- TOP ---------------- */

async function loadTop(append, silent) {
  if (!append && !silent) view.innerHTML = topHeader() + '<div class="loading"></div><div class="loading"></div><div class="loading"></div>';
  const offset = append && S.top ? S.top.items.length : 0;
  let res;
  try { res = await api('/api/app/top?offset=' + offset); } catch (e) { return; }
  if (S.tab !== 'top') return;
  if (append && S.top) res.items = S.top.items.concat(res.items);
  S.top = res;
  renderTop();
}

function topHeader() {
  const ev = S.me.event;
  return topline(`<span class="label num" id="pts">${S.me.user.points} LYFE POINTS</span>`) + `
    <h1 class="mega" style="font-size:clamp(32px,10.5vw,56px)">TOP<br>REQUESTS</h1>
    ${ev ? `<div class="meta"><span>${esc(ev.title)}</span><span>${esc(ev.date)}</span></div>` : ''}
    <div class="legend"><span>${esc(L('legend_vote'))}</span><span>${esc(L('legend_boost', { c: rules().cost_boost }))}</span></div>`;
}

function renderTop() {
  const t = S.top;
  if (!t.event || !t.items.length) {
    view.innerHTML = topHeader() + say(L(t.event ? 'top_empty_t' : 'no_event_t'), L(t.event ? 'top_empty_s' : 'no_event_s')) +
      (t.event && t.event.accepts_requests ? `<button class="btn" id="first" style="margin-top:20px">${esc(L('add_track'))}</button>` : '');
    const f = $('#first'); if (f) f.onclick = () => go('add');
    return;
  }
  const open = t.event.accepts_requests;
  const boostsLeft = rules().boosts_max - tonight().boosts_used;
  const c = rules().cost_boost;
  view.innerHTML = topHeader() + `<ul class="board">` + t.items.map((it, i) => {
    const played = it.status === 'PLAYED';
    const cls = [it.priority ? 'pri' : '', played ? 'played' : ''].join(' ');
    const tags = (it.priority ? `<span class="tag">${esc(L('priority'))}</span>` : '') +
      (played ? `<span class="tag">${esc(L('played'))}</span>` : '') +
      (it.mine ? `<span class="tag">${esc(L('you'))}</span>` : '');
    const canVote = open && !played && !it.mine && !it.voted;
    const canBoost = open && !played && boostsLeft > 0;
    return `<li class="${cls}">
      <span class="pos num">${pad(it.position)}</span>
      <div class="tinfo"><div class="ttitle">${esc(it.title)}</div><div class="tartist">${tags}${esc(it.artist)}</div></div>
      <div class="right">
        <span class="score num">${it.score}</span>
        <button class="act" data-vote="${i}" ${canVote ? '' : 'disabled'} aria-label="like">${it.voted || it.mine ? '♥' : '♡'}</button>
        <button class="act boost" data-boost="${i}" ${canBoost ? '' : 'disabled'} aria-label="boost">+${c}</button>
      </div></li>`;
  }).join('') + `</ul>` + `<div style="text-align:right;margin-top:10px">${hiddenPumpkin('top')}</div>` +
    (t.items.length < t.total ? `<div style="margin-top:22px"><button class="link" id="more">${esc(L('more'))} ↓</button></div>` : '');

  view.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => doVote(t.items[+b.dataset.vote], b));
  view.querySelectorAll('[data-boost]').forEach(b => b.onclick = async () => { if (await doBoost(t.items[+b.dataset.boost])) loadTop(false, true); });
  const m = $('#more'); if (m) m.onclick = () => loadTop(true);
}

async function doVote(item, button) {
  button.disabled = true;
  haptic('light');
  let res;
  try { res = await api('/api/app/vote/' + item.id, { method: 'POST' }); } catch (e) { button.disabled = false; return; }
  setPoints(res.points);
  const msg = { VOTED: 'vote_done', ALREADY_VOTED: 'vote_already', OWN_TRACK: 'vote_own', EVENT_CLOSED: 'vote_closed' }[res.status];
  if (msg) toast(L(msg));
  if (res.status === 'VOTED') { item.voted = true; item.score += 1; item.votes += 1; renderTop(); }
}

async function doBoost(item) {
  const c = rules().cost_boost;
  const left = rules().boosts_max - tonight().boosts_used;
  if (left <= 0) { toast(L('boost_limit')); haptic('warning'); return false; }
  if (S.me.user.points < c) { toast(L('boost_poor', { c, have: S.me.user.points })); haptic('warning'); return false; }
  const name = [item.artist, item.title].filter(Boolean).join(' - ');
  if (!await confirmBox(L('boost_q_t'), L('boost_q', { c, track: name, left }), L('boost_go'))) return false;
  let res;
  try { res = await api('/api/app/boost/' + item.id, { method: 'POST' }); } catch (e) { return false; }
  if (res.status === 'BOOSTED') { toast(L('boost_done', { c }));
    setPoints(res.points);
    if (S.me.tonight) S.me.tonight.boosts_used = res.boosts_used;
    return true;
  }
  haptic('warning');
  toast({
    NOT_ENOUGH_POINTS: L('boost_poor', { c, have: res.points }), LIMIT_REACHED: L('boost_limit'),
    PLAYED: L('boost_played'), EVENT_CLOSED: L('vote_closed'),
  }[res.status] || L('error'));
  return false;
}

async function startGame() {
  if (S.busy) return;
  S.busy = true;
  let res;
  try { res = await api('/api/app/game/start', { method: 'POST' }); } catch (e) { S.busy = false; return; }
  S.busy = false;
  if (res.status !== 'OK') { toast(L('game_none')); haptic('warning'); return; }

  const el = document.createElement('div');
  el.className = 'game';
  el.innerHTML = `<div class="game-top"><span class="label accent">PUMPKIN RUSH</span><span class="g-score num" id="gScore">0</span><button class="g-close" id="gClose">×</button></div>
    <div class="g-timer"><i id="gTimer"></i></div>
    <div class="g-field" id="gField"><div class="g-center"><div class="n" id="gCount">3</div></div></div>`;
  document.body.appendChild(el);
  try { tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}

  const field = $('#gField'), scoreEl = $('#gScore'), timer = $('#gTimer');
  const pieces = res.pieces, seconds = res.seconds;
  const hits = [], live = new Map();
  let score = 0, t0 = 0, next = 0, over = false, aborted = false;

  $('#gClose').onclick = () => { aborted = true; over = true; el.remove(); renderHome(); };

  field.addEventListener('pointerdown', e => {
    const node = e.target.closest('.gp');
    if (!node || over || !t0) return;
    const piece = live.get(+node.dataset.id);
    if (!piece) return;
    live.delete(piece.id);
    hits.push({ id: piece.id, t: +((performance.now() - t0) / 1000).toFixed(3) });
    score = Math.max(0, score + piece.value);
    scoreEl.textContent = score;
    node.classList.add('hit');
    setTimeout(() => node.remove(), 300);
    const f = document.createElement('div');
    f.className = 'g-float';
    f.style.left = node.style.left; f.style.top = node.style.top;
    f.style.color = piece.value < 0 ? 'var(--ink)' : 'var(--accent)';
    f.textContent = (piece.value > 0 ? '+' : '−') + Math.abs(piece.value);
    field.appendChild(f); setTimeout(() => f.remove(), 700);
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(piece.kind === 'ghost' ? 'heavy' : 'light'); } catch (err) {}
  });

  // 3-2-1
  for (const n of [3, 2, 1]) {
    if (aborted) return;
    $('#gCount').textContent = n; await new Promise(r => setTimeout(r, 650));
  }
  if (aborted) return;
  $('#gCount').textContent = L('game_go'); await new Promise(r => setTimeout(r, 350));
  field.innerHTML = '';
  t0 = performance.now();

  function frame() {
    if (over) return;
    const t = (performance.now() - t0) / 1000;
    timer.style.transform = `scaleX(${Math.max(0, 1 - t / seconds)})`;
    while (next < pieces.length && pieces[next].at <= t) {
      const p = pieces[next++];
      const node = document.createElement('button');
      node.className = 'gp';
      node.dataset.id = p.id;
      node.style.left = (p.x * 100) + '%';
      node.style.top = (p.y * 100) + '%';
      node.innerHTML = ART[p.kind];
      field.appendChild(node);
      live.set(p.id, p);
      setTimeout(() => {
        if (live.has(p.id)) { live.delete(p.id); node.classList.add('gone'); setTimeout(() => node.remove(), 220); }
      }, p.ttl * 1000);
    }
    if (t >= seconds) { over = true; finishGame(); return; }
    nextFrame(frame);
  }
  nextFrame(frame);

  async function finishGame() {
    let r;
    try { r = await api(`/api/app/game/${res.id}/finish`, { body: { hits } }); } catch (e) { r = { score, best: score }; }
    let board = [];
    try { board = (await api('/api/app/game')).board || []; } catch (e) {}
    await refreshMe();
    const left = S.me.season ? S.me.season.game.attempts_left : 0;
    el.innerHTML = `<div class="game-top"><span class="label accent">PUMPKIN RUSH</span><button class="g-close" id="gClose">×</button></div>
      <div class="g-result">
        <span class="label">${esc(L('game_result'))}</span>
        <div class="big-num num" style="margin-top:8px">${r.score}</div>
        <p style="margin-top:12px;font-weight:600">${esc(L('game_best'))}: ${r.best ?? r.score}${r.place ? ' · ' + esc(L('game_place', { n: r.place })) : ''}</p>
        ${boardList(board)}
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:26px">
          ${left ? `<button class="btn" id="gAgain">${esc(L('game_again'))} (${left})</button>` : ''}
          <button class="btn plain" id="gDone" style="background:none;color:var(--ink);border:2px solid var(--ink)">${esc(L('game_close'))}</button>
        </div>
      </div>`;
    const close = () => { el.remove(); if (S.tab === 'home') renderHome(); };
    $('#gClose').onclick = close;
    $('#gDone').onclick = close;
    const again = $('#gAgain'); if (again) again.onclick = () => { el.remove(); startGame(); };
  }
}

/* ---------------- splash ----------------
   32 frames at 20 fps (the logo moment only), 20 per sheet (5x4, 405x720 each), then a crisp full
   resolution final frame for the hold. The clock only runs while the frame
   it needs is loaded, so a slow sheet pauses the picture instead of skipping.
   Sound plays if the webview allows it; otherwise a small ЗВУК button.
   Tap to skip. If nothing has loaded within 2.5 s the launch goes straight on. */

const SPLASH = { fps: 20, frames: 32, cols: 5, perSheet: 20, fw: 405, fh: 720, sheets: 2, hold: 450 };

// Next frame from requestAnimationFrame, or from a timer if the webview is
// not painting (opening animation, background): the splash must never freeze.
function nextFrame(cb) {
  let fired = false;
  const run = () => { if (!fired) { fired = true; cb(performance.now()); } };
  requestAnimationFrame(run);
  setTimeout(run, 40);
}

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => resolve(img));
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function playSplash() {
  const splash = $('#splash');
  const canvas = $('#splashCanvas');
  const audio = $('#splashAudio');
  const soundBtn = $('#splashSound');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fitCanvas() {
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
  }
  fitCanvas();
  // object-fit: cover, with the mark kept slightly above centre like the poster
  function draw(img, sx, sy, sw, sh) {
    const cw = canvas.width, ch = canvas.height;
    const scale = Math.max(cw / sw, ch / sh);
    const dw = sw * scale, dh = sh * scale;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh, (cw - dw) / 2, (ch - dh) * 0.42, dw, dh);
  }

  const sheets = [];
  const loading = [];
  for (let i = 0; i < SPLASH.sheets; i++) {
    loading[i] = loadImage(`/static/app/splash/s${i + 1}.jpg?v=${ASSET_V}`).then(img => (sheets[i] = img));
  }
  const finalLoad = loadImage(`/static/app/splash/final.jpg?v=${ASSET_V}`);

  let clock = 0, last = 0, started = false;
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };

    splash.addEventListener('click', e => { if (e.target !== soundBtn) finish(); });
    soundBtn.addEventListener('click', e => {
      e.stopPropagation();
      soundBtn.classList.remove('show');
      try { audio.currentTime = Math.min(clock, 2.0); } catch (err) {}
      audio.play().catch(() => {});
    });

    if (reduce) {
      finalLoad.then(img => { if (img) draw(img, 0, 0, img.width, img.height); setTimeout(finish, img ? 900 : 0); });
      return;
    }

    const firstGuard = setTimeout(() => { if (!started) finish(); }, 2500);
    setTimeout(finish, 7000);   // absolute ceiling, whatever happens

    loading[0].then(first => {
      if (!first || done) { finish(); return; }
      started = true;
      clearTimeout(firstGuard);
      audio.play().catch(() => soundBtn.classList.add('show'));
      last = performance.now();
      nextFrame(tick);
    });

    function tick(now) {
      if (done) return;
      const frame = Math.min(SPLASH.frames - 1, Math.floor(clock * SPLASH.fps));
      const sheetIndex = Math.floor(frame / SPLASH.perSheet);
      const sheet = sheets[sheetIndex];
      if (sheet) {
        const n = frame % SPLASH.perSheet;
        draw(sheet, (n % SPLASH.cols) * SPLASH.fw, Math.floor(n / SPLASH.cols) * SPLASH.fh, SPLASH.fw, SPLASH.fh);
        clock += Math.min(0.1, (now - last) / 1000);
        // a sheet that is fully behind us can be let go
        if (sheetIndex > 0 && sheets[sheetIndex - 1]) sheets[sheetIndex - 1] = null;
      }
      // else: that sheet is still loading — hold the picture, the clock waits
      last = now;
      if (frame >= SPLASH.frames - 1) {
        finalLoad.then(img => {
          if (img) draw(img, 0, 0, img.width, img.height);
          setTimeout(finish, SPLASH.hold);
        });
        return;
      }
      nextFrame(tick);
    }
  });
}
function hideSplash() {
  const splash = $('#splash');
  if (!splash) return;
  const audio = $('#splashAudio');
  splash.classList.add('out');
  if (audio && !audio.paused) {
    let v = audio.volume;
    const fade = setInterval(() => { v = Math.max(0, v - 0.12); audio.volume = v; if (v === 0) clearInterval(fade); }, 40);
  }
  setTimeout(() => { if (audio) audio.pause(); splash.remove(); }, 600);
}

/* ---------------- boot ---------------- */

(async function boot() {
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); tg.setBottomBarColor && tg.setBottomBarColor('#ffffff'); } catch (e) {}
    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }
  const splashDone = playSplash();
  if (!INIT_DATA) { await splashDone; renderOutside(); hideSplash(); return; }

  // The animation and the first request run side by side; whichever is slower decides.
  const loaded = refreshMe().then(() => true, () => false);
  const [ok] = await Promise.all([loaded, splashDone]);
  if (!ok) { hideSplash(); return; }
  $('#tabbar').hidden = false;
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  go(['add', 'top', 'me'].includes(start) ? start : 'home');
  hideSplash();

  // Keep the chart honest while it is on screen.
  setInterval(() => {
    if (document.hidden || S.busy) return;
    if (S.tab === 'top' && S.top && S.top.items.length <= S.top.page_size) loadTop(false, true);
  }, 20000);
})();
</script>
