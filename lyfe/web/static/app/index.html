  view.innerHTML = topHeader() + `<ul class="vchart">` + t.items.map((it, i) => {
    const played = it.status === 'PLAYED';
    const lead = i === 0 && !played;
    const tags = (it.priority ? `<span class="vtag pri">${esc(L('priority'))}</span>` : '') +
      (played ? `<span class="vtag done">${esc(L('played'))}</span>` : '') +
      (it.mine ? `<span class="vtag you">${esc(L('you'))}</span>` : '');
    const canVote = open && !played && !it.mine && !it.voted && !it.disliked && tonight().votes_used < rules().votes_max;
    const canBoost = open && !played && it.mine && boostsLeft > 0;
    const wanted = it.mine ? '' : `<button class="vr-wanted${it.disliked ? ' on' : ''}" data-dis="${i}" ${canDislike(it, open) ? '' : 'disabled'} aria-label="${esc(L('dis_btn'))}">${STAR}${it.dislikes ? `<span class="num">${it.dislikes}</span>` : ''}</button>`;
    const fire = `<button class="vr-fire${it.voted ? ' on' : ''}" data-vote="${i}" ${canVote ? '' : 'disabled'} aria-label="${esc(L('fire'))}">${FIRE}<span class="num">${it.score}</span></button>`;
    const boost = it.mine ? `<button class="vboost" data-boost="${i}" ${canBoost ? '' : 'disabled'}>${esc(L('boost_btn'))}<small class="num">−$ ${c}</small></button>` : '';
    return `<li class="${[lead ? 'lead' : '', played ? 'played' : ''].join(' ').trim()}">
      <span class="pos num">${it.position}</span>
      <div class="tx"><div class="tt">${esc(it.title)}</div><div class="ta">${tags}${esc(it.artist)}</div></div>
      ${lead ? '<div class="veq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>' : ''}
      <div class="vacts">${wanted}${fire}${boost}</div></li>`;
  }).join('') + `</ul>` +
    (t.items.length < t.total ? `<div style="margin-top:22px"><button class="link" id="more">${esc(L('more_btn'))}</button></div>` : '') + TOP_END;

  view.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => doVote(t.items[+b.dataset.vote], b));
  view.querySelectorAll('[data-dis]').forEach(b => b.onclick = () => doDislike(t.items[+b.dataset.dis], b));
  view.querySelectorAll('[data-boost]').forEach(b => b.onclick = async () => { if (await doBoost(t.items[+b.dataset.boost])) loadTop(false, true); });
  const m = $('#more'); if (m) m.onclick = () => loadTop(true);
}

// a like can come from the Radio tab or from the radio block on the home screen
function afterVote() { if (S.tab === 'top') renderTop(); else if (S.tab === 'home') renderHomeRadio(); }

async function doVote(item, button) {
  button.disabled = true;
  haptic('light');
  let res;
  try { res = await api('/api/app/vote/' + item.id, { method: 'POST' }); } catch (e) { button.disabled = false; return; }
  setPoints(res.points);
  const msg = { VOTED: 'vote_done', ALREADY_VOTED: 'vote_already', OWN_TRACK: 'vote_own', EVENT_CLOSED: 'vote_closed', LIMIT: 'vote_limit' }[res.status];
  if (msg) toast(L(msg, { m: rules().votes_max }));
  if (res.status === 'LIMIT') { tonight().votes_used = rules().votes_max; afterVote(); }
  if (res.status === 'VOTED') {
    item.voted = true; item.score += 1; item.votes += 1; item.justVoted = true; tonight().votes_used += 1;
    afterVote(); item.justVoted = false;
  }
}

/* «В розыск»: −1 to someone else's track, its own cap, earns nothing */
async function doDislike(item, button) {
  button.disabled = true;
  haptic('warning');
  let res;
  try { res = await api('/api/app/dislike/' + item.id, { method: 'POST' }); } catch (e) { button.disabled = false; return; }
  const msg = { VOTED: 'dis_done', ALREADY_VOTED: 'dis_already', OWN_TRACK: 'dis_own', EVENT_CLOSED: 'vote_closed', LIMIT: 'dis_limit' }[res.status];
  if (msg) toast(L(msg, { m: rules().dislikes_max }));
  if (res.status === 'LIMIT') { tonight().dislikes_used = rules().dislikes_max; afterVote(); }
  if (res.status === 'VOTED') {
    item.disliked = true; item.score -= 1; item.dislikes = (item.dislikes || 0) + 1; tonight().dislikes_used = (tonight().dislikes_used || 0) + 1;
    afterVote();
  }
}
function canDislike(it, open) {
  return open && it.status !== 'PLAYED' && !it.mine && !it.voted && !it.disliked && (tonight().dislikes_used || 0) < (rules().dislikes_max || 0);
}

async function doBoost(item) {
  const c = rules().cost_boost;
  const left = rules().boosts_max - tonight().boosts_used;
  if (left <= 0) { toast(L('boost_limit')); haptic('warning'); return false; }
  if (S.me.user.points < c) { toast(L('boost_poor', { c, have: S.me.user.points })); haptic('warning'); return false; }
  const name = [item.artist, item.title].filter(Boolean).join(' - ');
  if (!await confirmBox(L('boost_q_t'), L('boost_q', { c, track: name, left }), L('boost_go'))) return false;
  let res;
  try { res = await api('/api/app/boost/' + item.id, { method: 'POST' }); } catch (e) { return false; }
  if (res.status === 'BOOSTED') { toast(L('boost_done', { c }));
    setPoints(res.points);
    if (S.me.tonight) S.me.tonight.boosts_used = res.boosts_used;
    return true;
  }
  haptic('warning');
  toast({
    NOT_ENOUGH_POINTS: L('boost_poor', { c, have: res.points }), LIMIT_REACHED: L('boost_limit'), NOT_OWN: L('boost_own'),
    PLAYED: L('boost_played'), EVENT_CLOSED: L('vote_closed'),
  }[res.status] || L('error'));
  return false;
}

  if (!g.event) return L('gang_no_event');

/* ---------------- ВЗЛОМ ----------------
   The server sends the ten locks (zone, width, speed, direction). The needle
   here runs the same formula the server replays: angle = dir × speed × t, from
   12 o'clock, t = seconds since this lock appeared. Each tap's t goes back to
   the server, which decides how many locks were really opened. */

const HACK = { run: null };
function hackArc(a0, a1, r) {
  const p = a => [150 + r * Math.sin(a * Math.PI / 180), 150 - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function hackTicks() {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 112 : 104, r2 = 124;
    s += `<line x1="${(150 + r1 * Math.sin(a)).toFixed(1)}" y1="${(150 - r1 * Math.cos(a)).toFixed(1)}" x2="${(150 + r2 * Math.sin(a)).toFixed(1)}" y2="${(150 - r2 * Math.cos(a)).toFixed(1)}" stroke="rgba(255,241,220,${i % 5 ? .35 : .8})" stroke-width="${i % 5 ? 2 : 3}"/>`;
  }
  return s;
}
async function startHack() {
  if (HACK.run) return;
  haptic('light');
  let res;
  try { res = await api('/api/app/hack/start', { method: 'POST' }); } catch (e) { return; }
  if (res.status !== 'OK') { toast(L(res.status === 'NO_ATTEMPTS_LEFT' ? 'hack_no_left' : res.status === 'NO_ATTEMPTS' ? 'hack_no_att' : res.status === 'NO_GANG' ? 'hack_no_gang' : S.gang && S.gang.hack.waiting ? 'hack_waiting' : 'hack_closed')); haptic('warning'); return; }
  const el = document.createElement('div');
  el.className = 'hack';
  el.innerHTML = `<div class="hack-sky"></div>
    <div class="hack-top"><div class="hack-lvl"><b class="num" id="hlvl">1</b><span>${esc(L('hack_lock', { n: res.locks.length }))}</span>
      <div class="hack-bar">${res.locks.map(() => '<i></i>').join('')}</div></div>
      <button class="hack-x" id="hx" aria-label="${esc(L('hack_exit'))}">×</button></div>
    <div class="hack-lock"><svg viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="138" fill="#120720" stroke="#FFF1DC" stroke-width="3"/>${hackTicks()}
      <path id="hzone" fill="none" stroke="#7CFF6B" stroke-width="20"/>
      <circle cx="150" cy="150" r="96" fill="#1A0B2E" stroke="#3B1456" stroke-width="2"/>
      <g id="hneedle"><line x1="150" y1="150" x2="150" y2="22" stroke="#FF3D8B" stroke-width="6" stroke-linecap="round"/></g>
      <circle cx="150" cy="150" r="14" fill="#FF3D8B" stroke="#1A0B2E" stroke-width="4"/>
      <text x="150" y="196" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="16" fill="#FFF1DC">LYFE PD</text>
    </svg></div>
    <p class="hack-hint" id="hhint">${esc(L('hack_hint'))}</p>
    <div class="hack-cash num" id="hcash">$ 0</div>
    <div class="hack-go"><button class="vbtn" id="hgo">${esc(L('hack_btn'))}</button></div>`;
  document.body.appendChild(el);
  const run = HACK.run = { id: res.id, locks: res.locks, step: res.loot_step, rule: res.loot, maxTap: res.max_tap, i: 0, taps: [], t0: 0, raf: 0, el, busy: false, loot: 0 };
  $('#hx').onclick = async () => {
    if (!await confirmBox(L('hack_exit'), L('hack_exit_q'), L('hack_exit'))) return;
    hackFinish(false, true);
  };
  $('#hgo').onclick = hackTap;
  el.querySelector('.hack-lock').addEventListener('pointerdown', hackTap);
  hackLock();
}
function hackLock() {
  const run = HACK.run; if (!run) return;
  const lock = run.locks[run.i];
  $('#hlvl').textContent = run.i + 1;
  run.el.querySelectorAll('.hack-bar i').forEach((b, k) => { b.className = k < run.i ? 'on' : k === run.i ? 'now' : ''; });
  $('#hzone').setAttribute('d', hackArc(lock.start, lock.start + lock.width, 118));
  run.t0 = performance.now();
  run.busy = false;
  const needle = $('#hneedle');
  const frame = now => {
    if (HACK.run !== run) return;
    const t = (now - run.t0) / 1000;
    if (t > run.maxTap) { hackMiss(true); return; }
    const angle = ((lock.dir * lock.speed * t) % 360 + 360) % 360;
    needle.setAttribute('transform', `rotate(${angle.toFixed(2)} 150 150)`);
    run.raf = requestAnimationFrame(frame);
  };
  run.raf = requestAnimationFrame(frame);
}
// the same sum the server pays (hack_service.lock_loot): opening + aim + speed
function hackLoot(run, lock, t, angle) {
  const r = run.rule; if (!r) return run.step * lock.n;
  let pos = ((angle - lock.start) % 360 + 360) % 360; if (pos > 180) pos -= 360;
  const half = lock.width / 2, aim = Math.max(0, 1 - Math.abs(pos - half) / half);
  const turn = 360 / lock.speed, edge = lock.dir === 1 ? lock.start : 360 - lock.start - lock.width;
  let first = (edge - r.grace) / lock.speed; while (first < r.react) first += turn;
  const lap = Math.max(0, Math.floor((t - first) / turn));
  const fast = lap === 0 ? r.fast * lock.n : lap === 1 ? Math.floor(r.fast * lock.n / 2) : 0;
  return { x: r.base * lock.n + Math.round(r.aim * lock.n * aim) + fast, aim, lap };
}
function hackTap(e) {
  if (e && e.preventDefault) e.preventDefault();
  const run = HACK.run; if (!run || run.busy) return;
  const t = (performance.now() - run.t0) / 1000;
  const lock = run.locks[run.i];
  const angle = ((lock.dir * lock.speed * t) % 360 + 360) % 360;
  const d = ((angle - lock.start) % 360 + 360) % 360;
  run.taps.push(Number(t.toFixed(4)));
  run.busy = true;
  cancelAnimationFrame(run.raf);
  // the page only predicts; the server's replay is what counts
  if (d <= lock.width + 3 || d >= 357) {
    const got = hackLoot(run, lock, t, angle);
    const x = typeof got === 'number' ? got : got.x;
    run.loot += x;
    $('#hcash').textContent = '$ ' + fmtMoney(run.loot);
    const tag = typeof got === 'number' ? '' : got.aim >= 0.85 ? L('hack_bull') : got.lap === 0 ? L('hack_quick') : '';
    $('#hhint').textContent = L('hack_open', { n: run.i + 1, x: fmtMoney(x) }) + (tag ? '. ' + tag : '');
    haptic('ok');
    run.el.classList.remove('flash'); void run.el.offsetWidth; run.el.classList.add('flash');
    run.i += 1;
    if (run.i >= run.locks.length) { setTimeout(() => hackFinish(true), 350); return; }
    setTimeout(() => { if (HACK.run === run) { $('#hhint').textContent = L('hack_hint'); hackLock(); } }, 600);
  } else {
    hackMiss(false);
  }
}
function hackMiss(timeout) {
  const run = HACK.run; if (!run) return;
  cancelAnimationFrame(run.raf);
  run.busy = true;
  haptic('error');
  run.el.classList.remove('shake'); void run.el.offsetWidth; run.el.classList.add('shake');
  if (timeout) $('#hhint').textContent = L('hack_timeout');
  setTimeout(() => hackFinish(false), 300);
}
async function hackFinish(win, quit) {
  const run = HACK.run; if (!run) return;
  cancelAnimationFrame(run.raf);
  run.busy = true;
  let res = null;
  try { res = await api(`/api/app/hack/${run.id}/finish`, { body: { taps: run.taps } }); } catch (e) {}
  if (quit) { hackClose(); return; }
  const score = res && res.status === 'OK' ? res.score : 0;
  const levels = res && res.status === 'OK' ? res.levels : 0;
  const won = levels >= run.locks.length;
  const box = document.createElement('div');
  box.className = 'hack-res ' + (won ? 'win' : 'lose');
  box.innerHTML = won
    ? `<h2>${esc(L('hack_win'))}</h2><p>${esc(L('hack_win_s', { n: levels }))}</p><div class="got num">+$ ${fmtMoney(score)}</div>`
    : `<h2>WASTED</h2><p>${esc(L('hack_wasted_s'))}</p>${score ? `<div class="got num">${esc(L('hack_got', { x: fmtMoney(score) }))}</div>` : ''}`;
  box.innerHTML += `<p style="font-size:15px;color:rgba(255,241,220,.7)">${res && res.best ? esc(L(res.best === score && score > 0 ? 'hack_new_best' : 'hack_best', { b: fmtMoney(res.best) })) : ''}</p>
    <div class="row"><button class="vbtn" id="hagain">${esc(L('hack_again'))}</button><button class="vbtn sand" id="hgang">${esc(L('hack_to_gang'))}</button></div>`;
  run.el.appendChild(box);
  haptic(won ? 'ok' : 'error');
  // the result holds the screen for 1.5 s before the buttons answer, so a late tap does not skip it
  box.querySelectorAll('button').forEach(b => { b.disabled = true; });
  setTimeout(() => box.querySelectorAll('button').forEach(b => { b.disabled = false; }), 1500);
  $('#hagain').onclick = () => { hackClose(); startHack(); };
  $('#hgang').onclick = () => { hackClose(); go('gang'); };
}

  const run = HACK.run; if (!run) return;
  cancelAnimationFrame(run.raf);
  run.el.remove();

async function startGame() {
  if (S.busy) return;
  S.busy = true;
  let res;
  try { res = await api('/api/app/game/start', { method: 'POST' }); } catch (e) { S.busy = false; return; }
  S.busy = false;
  if (res.status !== 'OK') {
    const gm = S.me.season && S.me.season.game;
    toast(res.status === 'CLOSED' ? (gm && gm.waiting ? L('game_wait') : L('game_closed', { n: (gm && gm.places) || 5 })) : L('game_none'));
    haptic('warning'); return;
  }

  const el = document.createElement('div');
  el.className = 'game';
  el.innerHTML = `<div class="game-top"><span class="label accent">PUMPKIN RUSH</span><span class="g-mult num" id="gMult"></span><span class="g-score num" id="gScore">0</span><button class="g-close" id="gClose">×</button></div>
    <div class="g-timer"><i id="gTimer"></i></div>
    <div class="g-field" id="gField"><div class="g-center"><div class="n" id="gCount">3</div></div></div>`;
  document.body.appendChild(el);
  try { tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}

  const field = $('#gField'), scoreEl = $('#gScore'), timer = $('#gTimer'), multEl = $('#gMult');
  const pieces = res.pieces, seconds = res.seconds;
  // same rules as the server (season_service.score_hits) so the live score matches the result
  const SCR = (S.me.season && S.me.season.game.scoring) || { streak_step: 5, max_mult: 5, fast_share: 0.4, ghost: 3 };
  const mult = () => Math.min(SCR.max_mult, 1 + Math.floor(streak / SCR.streak_step));
  const showMult = () => { multEl.textContent = mult() > 1 ? '×' + mult() : ''; };
  const hits = [], live = new Map();
  let score = 0, streak = 0, t0 = 0, next = 0, over = false, aborted = false;

  $('#gClose').onclick = () => { aborted = true; over = true; el.remove(); renderHome(); };

  field.addEventListener('pointerdown', e => {
    const node = e.target.closest('.gp');
    if (!node || over || !t0) return;
    const piece = live.get(+node.dataset.id);
    if (!piece) return;
    live.delete(piece.id);
    const t = +((performance.now() - t0) / 1000).toFixed(3);
    hits.push({ id: piece.id, t });
    let gain, why = '';
    if (piece.value < 0) { gain = piece.value; score = Math.max(0, score + gain); streak = 0; }
    else {
      const fast = t - piece.at <= SCR.fast_share * piece.ttl ? 1 : 0, m = mult();
      gain = (piece.value + fast) * m; score += gain; streak += 1;
      // say where the points came from: base, fast tap, streak multiplier
      why = [fast ? '⚡' + L('game_fast') : '', m > 1 ? '×' + m : ''].filter(Boolean).join(' ');
    }
    scoreEl.textContent = score; showMult();
    node.classList.add('hit');
    setTimeout(() => node.remove(), 300);
    const f = document.createElement('div');
    f.className = 'g-float';
    f.style.left = node.style.left; f.style.top = node.style.top;
    f.style.color = piece.value < 0 ? 'var(--ink)' : 'var(--accent)';
    f.innerHTML = esc((gain > 0 ? '+' : '−') + Math.abs(gain)) + (why ? `<small>${esc(why)}</small>` : '');
    field.appendChild(f); setTimeout(() => f.remove(), 700);
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(piece.kind === 'ghost' ? 'heavy' : 'light'); } catch (err) {}
  });

  // 3-2-1
  for (const n of [3, 2, 1]) {
    if (aborted) return;
    $('#gCount').textContent = n; await new Promise(r => setTimeout(r, 650));
  }
  if (aborted) return;
  $('#gCount').textContent = L('game_go'); await new Promise(r => setTimeout(r, 350));
  field.innerHTML = '';
  t0 = performance.now();

  function frame() {
    if (over) return;
    const t = (performance.now() - t0) / 1000;
    timer.style.transform = `scaleX(${Math.max(0, 1 - t / seconds)})`;
    while (next < pieces.length && pieces[next].at <= t) {
      const p = pieces[next++];
      const node = document.createElement('button');
      node.className = 'gp';
      node.dataset.id = p.id;
      node.style.left = (p.x * 100) + '%';
      node.style.top = (p.y * 100) + '%';
      node.innerHTML = ART[p.kind];
      field.appendChild(node);
      live.set(p.id, p);
      setTimeout(() => {
        if (live.has(p.id)) {
          live.delete(p.id); node.classList.add('gone'); setTimeout(() => node.remove(), 220);
          if (p.value > 0 && !over) { streak = 0; showMult(); }      // a missed pumpkin breaks the streak
        }
      }, p.ttl * 1000);
    }
    if (t >= seconds) { over = true; finishGame(); return; }
    nextFrame(frame);
  }
  nextFrame(frame);

  async function finishGame() {
    let r;
    try { r = await api(`/api/app/game/${res.id}/finish`, { body: { hits } }); } catch (e) { r = { score, best: score }; }
    let board = [];
    try { board = (await api('/api/app/game')).board || []; } catch (e) {}
    await refreshMe();
    const left = S.me.season ? S.me.season.game.attempts_left : 0;
    el.innerHTML = `<div class="game-top"><span class="label accent">PUMPKIN RUSH</span><button class="g-close" id="gClose">×</button></div>
      <div class="g-result">
        <span class="label">${esc(L('game_result'))}</span>
        <div class="big-num num" style="margin-top:8px">${r.score}</div>
        <p style="margin-top:12px;font-weight:600">${esc(L('game_best'))}: ${r.best ?? r.score}${r.place ? ' · ' + esc(L('game_place', { n: r.place })) : ''}</p>
        ${boardList(board)}
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:26px">
          ${left ? `<button class="btn" id="gAgain">${esc(L('game_again'))} (${left})</button>` : ''}
          <button class="btn plain" id="gDone" style="background:none;color:var(--ink);border:2px solid var(--ink)">${esc(L('game_close'))}</button>
        </div>
      </div>`;
    const close = () => { el.remove(); if (S.tab === 'home') renderHome(); };
    $('#gClose').onclick = close;
    $('#gDone').onclick = close;
    const again = $('#gAgain'); if (again) again.onclick = () => { el.remove(); startGame(); };
  }
}

/* ---------------- splash ----------------
   32 frames at 20 fps (the logo moment only), 20 per sheet (5x4, 405x720 each), then a crisp full
   resolution final frame for the hold. The clock only runs while the frame
   it needs is loaded, so a slow sheet pauses the picture instead of skipping.
   Sound plays if the webview allows it; otherwise a small ЗВУК button.
   Tap to skip. If nothing has loaded within 2.5 s the launch goes straight on. */

const SPLASH = { fps: 20, frames: 32, cols: 5, perSheet: 20, fw: 405, fh: 720, sheets: 2, hold: 450 };

// Next frame from requestAnimationFrame, or from a timer if the webview is
// not painting (opening animation, background): the splash must never freeze.
function nextFrame(cb) {
  let fired = false;
  const run = () => { if (!fired) { fired = true; cb(performance.now()); } };
  requestAnimationFrame(run);
  setTimeout(run, 40);
}

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => resolve(img));
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function playSplash() {
  const splash = $('#splash');
  const canvas = $('#splashCanvas');
  const audio = $('#splashAudio');
  const soundBtn = $('#splashSound');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fitCanvas() {
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
  }
  fitCanvas();
  // object-fit: cover, with the mark kept slightly above centre like the poster
  function draw(img, sx, sy, sw, sh) {
    const cw = canvas.width, ch = canvas.height;
    const scale = Math.max(cw / sw, ch / sh);
    const dw = sw * scale, dh = sh * scale;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, sx, sy, sw, sh, (cw - dw) / 2, (ch - dh) * 0.42, dw, dh);
  }

  const sheets = [];
  const loading = [];
  for (let i = 0; i < SPLASH.sheets; i++) {
    loading[i] = loadImage(`/static/app/splash/s${i + 1}.jpg?v=${ASSET_V}`).then(img => (sheets[i] = img));
  }
  const finalLoad = loadImage(`/static/app/splash/final.jpg?v=${ASSET_V}`);

  let clock = 0, last = 0, started = false;
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };

    splash.addEventListener('click', e => { if (e.target !== soundBtn) finish(); });
    soundBtn.addEventListener('click', e => {
      e.stopPropagation();
      soundBtn.classList.remove('show');
      try { audio.currentTime = Math.min(clock, 2.0); } catch (err) {}
      audio.play().catch(() => {});
    });

    if (reduce) {
      finalLoad.then(img => { if (img) draw(img, 0, 0, img.width, img.height); setTimeout(finish, img ? 900 : 0); });
      return;
    }

    const firstGuard = setTimeout(() => { if (!started) finish(); }, 2500);
    setTimeout(finish, 7000);   // absolute ceiling, whatever happens

    loading[0].then(first => {
      if (!first || done) { finish(); return; }
      started = true;
      clearTimeout(firstGuard);
      audio.play().catch(() => soundBtn.classList.add('show'));
      last = performance.now();
      nextFrame(tick);
    });

    function tick(now) {
      if (done) return;
      const frame = Math.min(SPLASH.frames - 1, Math.floor(clock * SPLASH.fps));
      const sheetIndex = Math.floor(frame / SPLASH.perSheet);
      const sheet = sheets[sheetIndex];
      if (sheet) {
        const n = frame % SPLASH.perSheet;
        draw(sheet, (n % SPLASH.cols) * SPLASH.fw, Math.floor(n / SPLASH.cols) * SPLASH.fh, SPLASH.fw, SPLASH.fh);
        clock += Math.min(0.1, (now - last) / 1000);
        // a sheet that is fully behind us can be let go
        if (sheetIndex > 0 && sheets[sheetIndex - 1]) sheets[sheetIndex - 1] = null;
      }
      // else: that sheet is still loading — hold the picture, the clock waits
      last = now;
      if (frame >= SPLASH.frames - 1) {
        finalLoad.then(img => {
          if (img) draw(img, 0, 0, img.width, img.height);
          setTimeout(finish, SPLASH.hold);
        });
        return;
      }
      nextFrame(tick);
    }
  });
}
function hideSplash() {
  const splash = $('#splash');
  if (!splash) return;
  const audio = $('#splashAudio');
  splash.classList.add('out');
  if (audio && !audio.paused) {
    let v = audio.volume;
    const fade = setInterval(() => { v = Math.max(0, v - 0.12); audio.volume = v; if (v === 0) clearInterval(fade); }, 40);
  }
  setTimeout(() => { if (audio) audio.pause(); splash.remove(); }, 600);
}

/* ---------------- boot ---------------- */

(async function boot() {
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); tg.setBottomBarColor && tg.setBottomBarColor('#ffffff'); } catch (e) {}
    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }
  const splashDone = playSplash();
  if (!INIT_DATA) { await splashDone; renderOutside(); hideSplash(); return; }

  // The animation and the first request run side by side; whichever is slower decides.
  const loaded = refreshMe().then(() => true, () => false);
  const [ok] = await Promise.all([loaded, splashDone]);
  if (!ok) { hideSplash(); return; }
  $('#tabbar').hidden = false;
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (/^gang_[A-Za-z0-9]{4,16}$/.test(start)) joinFromLink(start.slice(5));
  else go(['add', 'top', 'gang', 'me'].includes(start) ? start : 'home');
  hideSplash();

  // Keep the chart honest while it is on screen.
  setInterval(() => {
    if (document.hidden || S.busy) return;
    if (S.tab === 'top' && S.top && S.top.items.length <= S.top.page_size) loadTop(false, true);
  }, 20000);
})();
</script>
