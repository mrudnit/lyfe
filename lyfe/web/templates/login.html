<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LYFE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #0a0a0b; color: #f4f4f5; padding: 24px;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  form { width: 100%; max-width: 340px; }
  h1 { font-size: 13px; letter-spacing: .32em; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #71717a; font-size: 13px; letter-spacing: .18em; margin: 0 0 32px; }
  input {
    width: 100%; padding: 16px; margin-bottom: 12px; font-size: 16px;
    background: #18181b; color: #f4f4f5; border: 1px solid #27272a; border-radius: 12px;
  }
  input:focus { outline: none; border-color: #52525b; }
  button {
    width: 100%; padding: 17px; font-size: 16px; font-weight: 600; margin-top: 8px;
    background: #f4f4f5; color: #0a0a0b; border: 0; border-radius: 12px; cursor: pointer;
  }
  .error {
    background: #2a1215; border: 1px solid #7f1d1d; color: #fca5a5;
    padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px;
  }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>LYFEPARTY</h1>
    <p class="sub">DJ LIVE</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input name="login" placeholder="Логин" autocapitalize="off" autocomplete="username" required autofocus>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
