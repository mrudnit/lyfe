<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LYFE CHECK-IN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0a0a0b; color: #f4f4f5; min-height: 100dvh;
    font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid #1f1f23; display: flex; align-items: center; gap: 12px;
  }
  h1 { font-size: 12px; letter-spacing: .28em; margin: 0; font-weight: 600; }
  .meta { color: #71717a; font-size: 12px; margin-top: 2px; }
  .right { margin-left: auto; text-align: right; }
  .count { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .count-label { font-size: 10px; color: #52525b; letter-spacing: .12em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
  .dot.off { background: #ef4444; }

  #video-wrap { position: relative; background: #000; aspect-ratio: 1; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .frame {
    position: absolute; inset: 16%; border: 3px solid #ffffff40; border-radius: 20px;
    pointer-events: none;
  }

  .result {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .result.show { display: flex; }
  .result.ok      { background: #14532d; }
  .result.already { background: #78350f; }
  .result.bad     { background: #7f1d1d; }
  .result .big { font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
  .result .who { font-size: 21px; font-weight: 600; margin-top: 10px; }
  .result .sub { font-size: 15px; opacity: .8; margin-top: 6px; }
  #r-rewards { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
  #r-rewards button {
    background: #ffffff; color: #0a0a0b; min-height: 52px; font-size: 15px; width: 100%;
  }
  #r-rewards button.done { background: #ffffff40; color: #ffffff; }

  .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  button, input {
    font: inherit; border-radius: 12px; padding: 15px; font-size: 16px;
  }
  input {
    background: #18181b; color: #f4f4f5; border: 1px solid #27272a; width: 100%;
  }
  button {
    border: 0; background: #27272a; color: #f4f4f5; font-weight: 600;
    min-height: 54px; cursor: pointer;
  }
  button.primary { background: #f4f4f5; color: #0a0a0b; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  .row button { min-width: 110px; }
  .hint { color: #52525b; font-size: 13px; text-align: center; }
  .queued { color: #fbbf24; font-size: 12px; }
  a.back { color: #52525b; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>CHECK-IN</h1>
    <div class="meta">
      {% if event %}{{ event.title|upper }}{% else %}Нет активного ивента{% endif %}
      · {{ admin.login }}/{{ admin.role }}
      · <span class="dot" id="dot"></span>
      <span class="queued" id="queued"></span>
    </div>
  </div>
  <div class="right">
    <div class="count" id="count">{{ checked_in }}</div>
    <div class="count-label">НА МЕСТЕ</div>
    <a class="back" href="/">→ DJ</a>
    <a class="back" href="/events">ивенты</a>
  </div>
</header>

<div id="video-wrap">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="result" id="result">
    <div class="big" id="r-big"></div>
    <div class="who" id="r-who"></div>
    <div class="sub" id="r-sub"></div>
    <div id="r-rewards"></div>
  </div>
</div>

<div class="panel">
  <button class="primary" id="start">Включить камеру</button>
  <div class="row">
    <input id="manual" inputmode="numeric" placeholder="LYFE ID, например 0842">
    <button id="manual-go">Отметить</button>
  </div>
  <div class="hint">Если код не читается — впиши номер с LYFE PASS вручную.</div>
</div>

<script src="/static/jsqr.js"></script>
<script>
const QUEUE_KEY = 'lyfe_scan_queue';
const video = document.getElementById('video');
const resultEl = document.getElementById('result');
const dot = document.getElementById('dot');
const queuedEl = document.getElementById('queued');
const countEl = document.getElementById('count');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
let lastCode = '';
let lastAt = 0;
let busy = false;
const device = (navigator.userAgent.match(/iPhone|iPad|Android|Mac/) || ['scanner'])[0];

function saveQueue() {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
  queuedEl.textContent = queue.length ? '↑ ' + queue.length : '';
}
function online(ok) { dot.classList.toggle('off', !ok); }

function show(kind, big, who, sub, pending) {
  resultEl.className = 'result show ' + kind;
  document.getElementById('r-big').textContent = big;
  document.getElementById('r-who').textContent = who || '';
  document.getElementById('r-sub').textContent = sub || '';

  const box = document.getElementById('r-rewards');
  box.innerHTML = '';
  (pending || []).forEach(reward => {
    const button = document.createElement('button');
    button.textContent = 'Выдать: ' + reward.name;
    button.onclick = async (e) => {
      e.stopPropagation();
      button.disabled = true;
      try {
        await fetch('/api/redemptions/' + reward.id + '/use', { method: 'POST' });
        button.textContent = '✓ ' + reward.name;
        button.className = 'done';
      } catch (err) {
        button.textContent = 'Не отправилось, повтори';
        button.disabled = false;
      }
    };
    box.appendChild(button);
  });

  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [40, 60, 40]);
  // Rewards need time to be handed over; a plain scan can disappear quickly.
  const hold = (pending && pending.length) ? 9000 : 2200;
  clearTimeout(window._hideTimer);
  window._hideTimer = setTimeout(() => resultEl.classList.remove('show'), hold);
}

document.getElementById('start').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    await video.play();
    document.getElementById('start').style.display = 'none';
    requestAnimationFrame(tick);
  } catch (e) {
    alert('Нет доступа к камере. Нужен https или localhost, и разрешение в браузере.');
  }
};

function tick() {
  if (video.readyState === video.HAVE_ENOUGH_DATA && !busy) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(image.data, image.width, image.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data) {
      const now = Date.now();
      // Ignore the same code for three seconds so one pass is one check-in.
      if (code.data !== lastCode || now - lastAt > 3000) {
        lastCode = code.data;
        lastAt = now;
        submit({ token: code.data });
      }
    }
  }
  requestAnimationFrame(tick);
}

document.getElementById('manual-go').onclick = () => {
  const input = document.getElementById('manual');
  const value = input.value.trim();
  if (!value) return;
  submit({ lyfe_id: value });
  input.value = '';
};

async function submit(payload) {
  busy = true;
  payload.device = device;
  try {
    const response = await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (response.status === 401) { location.href = '/login'; return; }

    if (response.status === 403) {
      online(true);
      return show('bad', '✕', 'Нет прав на скан',
        'Войди под учёткой с ролью MODERATOR или ADMIN');
    }
    if (!response.ok) {
      // The server answered, so this is not a connectivity problem —
      // queueing it would hide a real bug. Show what happened instead.
      online(true);
      let detail = '';
      try { detail = (await response.json()).detail || ''; } catch (e) {}
      return show('bad', '✕', 'Ошибка сервера ' + response.status, detail);
    }

    const data = await response.json();
    online(true);
    render(data);
  } catch (e) {
    // Nothing came back at all: no signal. Accept it, show it, send it later.
    online(false);
    queue.push(payload);
    saveQueue();
    show('ok', '✓', 'Принято офлайн', 'Отправится, когда вернётся связь');
  } finally {
    setTimeout(() => (busy = false), 900);
  }
}

function render(data) {
  if (typeof data.total === 'number') countEl.textContent = data.total;
  const who = data.name ? data.name + ' · LYFE #' + data.lyfe_id : '';
  switch (data.status) {
    case 'OK':
      return show('ok', '✓', who, '+' + data.points + ' LYFE POINTS', data.pending);
    case 'ALREADY':
      return show('already', '↺', who, 'Уже отмечен' +
        (data.checked_in_at ? ' в ' + new Date(data.checked_in_at)
          .toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : ''),
        data.pending);
    case 'WINDOW_CLOSED':
      return show('bad', '✕', who, 'Check-in закрыт');
    case 'INVALID_TOKEN':
      return show('bad', '✕', '', 'Код не наш');
    case 'UNKNOWN_USER':
      return show('bad', '✕', '', 'Не нашёл такого гостя');
    case 'BLOCKED':
      return show('bad', '✕', who, 'Гость заблокирован');
    case 'NO_EVENT':
      return show('bad', '✕', '', 'Нет активного ивента');
    default:
      return show('bad', '✕', '', data.status || 'Ошибка');
  }
}

async function flush() {
  while (queue.length) {
    try {
      const response = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(queue[0])
      });
      if (response.status === 401) { location.href = '/login'; return; }
      if (response.status >= 500) throw new Error(response.status);
      // A 4xx will never succeed on retry — drop it rather than loop forever.
      const data = await response.json().catch(() => ({}));
      if (typeof data.total === 'number') countEl.textContent = data.total;
      queue.shift();
      saveQueue();
      online(true);
    } catch (e) {
      online(false);
      return;
    }
  }
}

saveQueue();
setInterval(flush, 5000);
window.addEventListener('online', flush);
</script>
</body>
</html>
